<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cola · El taller de retratos</title>
<style>
 /* Widget de la cola para TikTok LIVE Studio. Fondo transparente; todo escala con el ancho de la fuente.
    Opciones en la dirección:  ?n=8 (cuántos se ven)   ?fondo=1 (fondo oscuro, para probar en el navegador) */
 html{font-size:4.2vw}
 body{margin:0;background:transparent;color:#fff3d6;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden}
 body.fondo{background:#16211f}
 *{box-sizing:border-box}
 #w{padding:.5rem;display:grid;gap:.45rem}
 header,#now,li,footer{border-radius:.5rem;background:linear-gradient(#14262aee,#0a1517f2);border:.07rem solid #b9862f;box-shadow:0 .2rem .6rem #000a}
 header{display:flex;align-items:baseline;justify-content:space-between;padding:.45rem .8rem}
 header b{font:italic 1.25rem Georgia,serif;color:#ffe9b0}
 header span{font-size:.8rem;color:#ffd772;font-weight:600}
 small{display:block;font-size:.6rem;font-weight:700;letter-spacing:.12rem;color:#e7c887}
 #now{display:grid;grid-template-columns:auto 1fr;gap:.2rem .7rem;align-items:center;padding:.5rem .7rem;border-color:#ffe596;box-shadow:0 0 1rem #ffb84a66}
 #now .av{width:3.3rem;height:3.3rem;grid-row:1/3}
 #now .nombre{font:1.25rem/1.1 Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 #now.libre .nombre{color:#cdbb93;font-style:italic}
 .regalos{display:flex;gap:.5rem;align-items:center;font-size:.85rem;color:#ffdca6;min-height:1.2rem}
 .regalo{display:inline-flex;align-items:center;gap:.1rem;font-weight:700;white-space:nowrap}
 .regalo img{width:1.5em;height:1.5em;object-fit:contain;filter:drop-shadow(0 .05rem .05rem #0008)}
 ol{position:relative;margin:0;padding:0;list-style:none;transition:height .4s}
 li{position:absolute;left:0;right:0;height:2.75rem;display:grid;grid-template-columns:1.5rem 2.1rem 1fr auto;gap:.55rem;align-items:center;padding:0 .7rem 0 .5rem;border-color:#4a5f56;transition:top .5s cubic-bezier(.2,.8,.2,1),opacity .4s,transform .4s}
 li.entra{opacity:0;transform:translateX(2rem)}
 li.sale{opacity:0;transform:translateX(-2rem)}
 li.pagado{border-color:#b9862f}
 li:first-child .n{color:#ffd772}
 .n{font:700 1rem Consolas,monospace;color:#a9b5a9;text-align:center}
 li .av{width:2.1rem;height:2.1rem}
 li .nombre{font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 li .regalos{font-size:.8rem;justify-content:flex-end}
 .av{display:grid;place-items:center;border-radius:.35rem;border:.07rem solid #d9b25c;background:#22332f center/cover;font:700 1.1em Georgia,serif;color:#fff8}
 footer{padding:.35rem .8rem;text-align:center;font-size:.8rem;border-color:#4a5f56}
 footer b{color:#ffd772}
 footer i{font-style:normal;color:#ffb3bf}
 .vacia{padding:.8rem;text-align:center;font-size:.9rem;color:#cdbb93;border:.07rem dashed #4a5f56;border-radius:.5rem;background:#0a1517cc}
</style></head><body>
<div id="w">
 <header><b>Cola de retratos</b><span id="len"></span></header>
 <section id="now"><span class="av"></span><small>AHORA PINTANDO</small><div><div class="nombre"></div><div class="regalos"></div></div></section>
 <ol id="list"></ol>
 <footer>Escribe <b>«yo»</b> · <i>un regalo te adelanta</i></footer>
</div>
<script>
 const P=new URLSearchParams(location.search),MAX=Math.min(30,Math.max(1,+P.get('n')||8)),ROW=3.1;
 if(P.get('fondo'))document.body.classList.add('fondo');
 const $=id=>document.getElementById(id),el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};
 function avatar(e,uid,u){
   const img=(u&&u.img)||'',demo=/^demo:(\d)$/.exec(img);e.textContent='';e.style.backgroundImage='';
   if(demo){const k=+demo[1]%4;e.style.backgroundImage='url("assets/retratos.jpg")';e.style.backgroundSize='200% 200%';e.style.backgroundPosition=(k%2?'100%':'0%')+' '+(k<2?'0%':'100%');}
   else if(/^https?:/.test(img)){e.style.backgroundSize='cover';e.style.backgroundPosition='center';e.style.backgroundImage=`url("avatar?u=${encodeURIComponent(img)}")`;}
   else{e.textContent=((u&&u.name)||uid||'?').replace(/^@/,'').charAt(0).toUpperCase();e.style.backgroundColor=`hsl(${[...String(uid)].reduce((s,c)=>s+c.charCodeAt(0)*7,0)%360},42%,34%)`;}
 }
 function chips(box,rec,max){
   box.textContent='';
   const gifts=rec.gifts&&rec.gifts.length?rec.gifts:rec.coins?[{name:'Rose',img:'',n:rec.coins}]:[];
   for(const g of gifts.slice(0,max)){
     const c=el('span','regalo');
     if(g.img){const im=el('img');im.alt='';im.src='avatar?u='+encodeURIComponent(g.img);c.appendChild(im);}else c.appendChild(el('span','',/^ros[ea]/i.test(g.name)?'🌹':'🎁'));
     c.appendChild(el('span','','×'+g.n));box.appendChild(c);
   }
 }
 const rows=new Map();let boot=null;
 function render(s){
   if(boot&&s.boot&&s.boot!==boot){location.reload();return;}boot=s.boot;
   const name=uid=>(s.users[uid]||{}).name||uid;
   $('len').textContent=s.queueLen?s.queueLen+(s.queueLen===1?' esperando':' esperando'):'';
   const now=$('now'),cur=s.current;now.classList.toggle('libre',!cur);
   now.querySelector('.nombre').textContent=cur?name(cur.uid):'Lienzo libre';
   if(cur){avatar(now.querySelector('.av'),cur.uid,s.users[cur.uid]);chips(now.querySelector('.regalos'),cur,3);}
   else{const a=now.querySelector('.av');a.textContent='?';a.style.backgroundImage='';a.style.backgroundColor='';now.querySelector('.regalos').textContent='Escribe «yo» y serás el siguiente';}
   // Filas con clave por usuario: al reordenarse se deslizan a su nuevo sitio.
   const list=$('list'),top=s.queue.slice(0,MAX),seen=new Set();
   top.forEach((q,i)=>{
     seen.add(q.uid);let li=rows.get(q.uid);
     if(!li){
       li=el('li','entra');li.append(el('span','n'),el('span','av'),el('span','nombre'),el('span','regalos'));
       li.style.top=i*ROW+'rem';list.appendChild(li);rows.set(q.uid,li);requestAnimationFrame(()=>requestAnimationFrame(()=>li.classList.remove('entra')));
     }
     li.style.top=i*ROW+'rem';li.style.zIndex=MAX-i;li.classList.toggle('pagado',q.coins>0);
     li.children[0].textContent=i+1;
     if(li.dataset.img!==((s.users[q.uid]||{}).img||'')){li.dataset.img=(s.users[q.uid]||{}).img||'';avatar(li.children[1],q.uid,s.users[q.uid]);}
     li.children[2].textContent=name(q.uid);
     const sig=JSON.stringify(q.gifts||q.coins);if(li.dataset.g!==sig){li.dataset.g=sig;chips(li.children[3],q,2);}
   });
   for(const [uid,li] of rows)if(!seen.has(uid)){rows.delete(uid);li.classList.add('sale');setTimeout(()=>li.remove(),450);}
   list.style.height=top.length*ROW+'rem';
   let v=list.querySelector('.vacia');
   if(!top.length&&!v){v=el('div','vacia','Nadie en la cola todavía');list.before(v);}
   else if(top.length){const old=document.querySelector('.vacia');if(old)old.remove();}
 }
 new EventSource('events').onmessage=e=>render(JSON.parse(e.data));
</script>
</body></html>
