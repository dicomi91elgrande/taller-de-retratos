<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cola · El taller de retratos</title>
<style>
 /* Widget de la cola para TikTok LIVE Studio, con el mismo estilo que SUPER CUADRO.
    Fondo transparente; todo escala con el ancho de la fuente. Tamaño recomendado 420 × 900.
    Opciones en la dirección:  ?n=8 (cuántos se ven)   ?fondo=1 (fondo oscuro, para probar en el navegador) */
 html{font-size:4.4vw}
 body{margin:0;background:transparent;color:#fff;font-family:'Bahnschrift SemiCondensed','Bahnschrift','Arial Narrow','Segoe UI',sans-serif;overflow:hidden}
 body.fondo{background:#16211f}
 *{box-sizing:border-box}
 #w{padding:.4rem .5rem .5rem;display:grid;gap:.4rem}
 header{display:flex;align-items:center;justify-content:space-between;padding:0 .3rem}
 header b{font-size:1.5rem;font-weight:700;letter-spacing:.06rem;color:#ffe08a;text-shadow:0 .08rem 0 #5a3a00,0 0 .7rem #ffb84a99}
 #len{padding:.1rem .7rem;border-radius:1rem;font-size:.95rem;font-weight:700;color:#fff;background:#0b0f1ae6;border:.08rem solid #ffffff55}
 #len:empty{display:none}
 small{display:block;font-size:.72rem;font-weight:700;letter-spacing:.14rem;color:#ffd772}
 /* Tarjeta de quien se está pintando: morada y dorada, como el top 1 */
 #now{position:relative;display:grid;grid-template-columns:auto 1fr;gap:0 .9rem;align-items:center;margin-top:.35rem;padding:.5rem .9rem;border-radius:.7rem;background:linear-gradient(100deg,#3a1d5c,#241238 55%,#3b1f33);border:.13rem solid #e8b84a;box-shadow:0 .2rem .7rem #000a,0 0 .9rem #ffb84a55,inset 0 0 1.2rem #ffb84a22}
 #now .av{width:3.8rem;height:3.8rem;border-color:#ffd772;box-shadow:0 0 .7rem #ffb84a99}
 #now .pincel{position:absolute;left:-.5rem;top:-1.1rem;font-size:1.5rem;transform:rotate(-12deg);filter:drop-shadow(0 .08rem .15rem #000a);animation:pinta 1s ease-in-out infinite}
 @keyframes pinta{50%{transform:rotate(8deg) translateY(.15rem)}}
 #now.libre .pincel{display:none}
 #now .nombre{font-size:1.45rem}
 #now.libre .nombre{color:#e6e2f5}
 #now>div{min-width:0}
 .nombre{font-weight:600;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 .08rem .15rem #0009}
 .regalos{display:flex;gap:.5rem;align-items:center;font-size:1rem;color:#f3c75a;min-height:1.3rem;white-space:nowrap}
 #now.libre .regalos{font-size:.85rem;color:#d9d3ee}
 .regalo{display:inline-flex;align-items:center;gap:.12rem;font-weight:700;white-space:nowrap}
 .regalo img{width:1.5em;height:1.5em;object-fit:contain;filter:drop-shadow(0 .05rem .05rem #0008)}
 /* Filas de la cola: azules; doradas si han regalado */
 ol{position:relative;margin:0;padding:0;list-style:none;transition:height .4s}
 li{position:absolute;left:0;right:0;height:2.95rem;display:grid;grid-template-columns:auto 1fr auto;gap:.8rem;align-items:center;padding:0 .8rem 0 .7rem;border-radius:.7rem;background:linear-gradient(100deg,#1b2a66,#141b45 55%,#161a3a);border:.1rem solid #9fb0e8;box-shadow:0 .15rem .5rem #000a;transition:top .5s cubic-bezier(.2,.8,.2,1),opacity .4s,transform .4s}
 li.pagado{background:linear-gradient(100deg,#34205a,#1d1440 55%,#2a1a3a);border-color:#e8b84a}
 li.entra{opacity:0;transform:translateX(2rem)}
 li.sale{opacity:0;transform:translateX(-2rem)}
 li .av{width:2.25rem;height:2.25rem;font-size:1.1rem}
 li .nombre{font-size:1.15rem}
 li .regalos{font-size:.95rem;justify-content:flex-end}
 .av{position:relative;flex:none;display:grid;place-items:center;border-radius:50%;border:.12rem solid #cfd6f5;background:#2c2a55 center/cover;font-size:1.6rem;font-weight:700;color:#ffffffb0}
 .av i{font-style:normal}
 .rank{position:absolute;right:-.3rem;bottom:-.3rem;min-width:1.1rem;height:1.1rem;padding:0 .2rem;border-radius:.6rem;display:grid;place-items:center;font-size:.7rem;font-weight:700;color:#1b1030;background:#e9ecf7;border:.07rem solid #fff;box-shadow:0 .08rem .2rem #000a}
 li.pagado .rank,li:first-child .rank{background:linear-gradient(#ffe596,#f0b232);border-color:#fff6cf}
 footer{padding:0 .3rem;text-align:center;font-size:.9rem;color:#f1e9d6;text-shadow:0 .08rem .15rem #000}
 footer b{color:#ffd772}
 footer i{font-style:normal;color:#ffb3bf}
 .vacia{padding:.7rem;text-align:center;font-size:1rem;color:#d9d3ee;border-radius:.7rem;border:.1rem dashed #9fb0e8;background:#141b45cc}
</style></head><body>
<div id="w">
 <header><b>COLA DE RETRATOS</b><span id="len"></span></header>
 <section id="now"><span class="av"><span class="pincel">🖌️</span><i></i></span><div><small>AHORA PINTANDO</small><div class="nombre"></div><div class="regalos"></div></div></section>
 <ol id="list"></ol>
 <footer>Escribe <b>«yo»</b> · <i>un regalo te adelanta</i></footer>
</div>
<script>
 const P=new URLSearchParams(location.search),MAX=Math.min(30,Math.max(1,+P.get('n')||8)),ROW=3.3;
 if(P.get('fondo'))document.body.classList.add('fondo');
 const $=id=>document.getElementById(id),el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};
 function avatar(e,uid,u){
   const img=(u&&u.img)||'',demo=/^demo:(\d)$/.exec(img),t=e.querySelector('i');t.textContent='';e.style.backgroundImage='';e.style.backgroundColor='';
   if(demo){const k=+demo[1]%4;e.style.backgroundImage='url("assets/retratos.jpg")';e.style.backgroundSize='200% 200%';e.style.backgroundPosition=(k%2?'100%':'0%')+' '+(k<2?'0%':'100%');}
   else if(/^https?:/.test(img)){e.style.backgroundSize='cover';e.style.backgroundPosition='center';e.style.backgroundImage=`url("avatar?u=${encodeURIComponent(img)}")`;}
   else{t.textContent=uid?((u&&u.name)||uid).replace(/^@/,'').charAt(0).toUpperCase():'?';if(uid)e.style.backgroundColor=`hsl(${[...String(uid)].reduce((s,c)=>s+c.charCodeAt(0)*7,0)%360},42%,34%)`;}
 }
 function chips(box,rec,max){
   box.textContent='';
   const gifts=rec.gifts&&rec.gifts.length?rec.gifts:rec.coins?[{name:'Rose',img:'',n:rec.coins}]:[];
   for(const g of gifts.slice(0,max)){
     const c=el('span','regalo');
     if(g.img){const im=el('img');im.alt='';im.src='avatar?u='+encodeURIComponent(g.img);c.appendChild(im);}else c.appendChild(el('span','',/^ros[ea]/i.test(g.name)?'🌹':'🎁'));
     c.appendChild(el('span','','×'+g.n));box.appendChild(c);
   }
 }
 const rows=new Map();let boot=null;
 function render(s){
   if(boot&&s.boot&&s.boot!==boot){location.reload();return;}boot=s.boot;
   const name=uid=>(s.users[uid]||{}).name||uid;
   $('len').textContent=s.queueLen?s.queueLen+' esperando':'';
   const now=$('now'),cur=s.current,key=cur?cur.uid+'|'+((s.users[cur.uid]||{}).img||''):'';now.classList.toggle('libre',!cur);
   now.querySelector('.nombre').textContent=cur?name(cur.uid):'Lienzo libre';
   if(now.dataset.k!==key){now.dataset.k=key;avatar(now.querySelector('.av'),cur&&cur.uid,cur&&s.users[cur.uid]);}
   if(cur)chips(now.querySelector('.regalos'),cur,3);else now.querySelector('.regalos').textContent='Escribe «yo» y serás el siguiente';
   // Filas con clave por usuario: al reordenarse se deslizan a su nuevo sitio.
   const list=$('list'),top=s.queue.slice(0,MAX),seen=new Set();
   top.forEach((q,i)=>{
     seen.add(q.uid);let li=rows.get(q.uid);
     if(!li){
       li=el('li','entra');const av=el('span','av');av.append(el('i'),el('span','rank'));li.append(av,el('span','nombre'),el('span','regalos'));
       li.style.top=i*ROW+'rem';list.appendChild(li);rows.set(q.uid,li);requestAnimationFrame(()=>requestAnimationFrame(()=>li.classList.remove('entra')));
     }
     li.style.top=i*ROW+'rem';li.style.zIndex=MAX-i;li.classList.toggle('pagado',q.coins>0);
     li.querySelector('.rank').textContent=i+1;
     const img=(s.users[q.uid]||{}).img||'';if(li.dataset.img!==img){li.dataset.img=img;avatar(li.children[0],q.uid,s.users[q.uid]);}
     li.children[1].textContent=name(q.uid);
     const sig=JSON.stringify(q.gifts||q.coins);if(li.dataset.g!==sig){li.dataset.g=sig;chips(li.children[2],q,2);}
   });
   for(const [uid,li] of rows)if(!seen.has(uid)){rows.delete(uid);li.classList.add('sale');setTimeout(()=>li.remove(),450);}
   list.style.height=Math.max(0,top.length*ROW-.35)+'rem';
   const v=document.querySelector('.vacia');
   if(!top.length&&!v)list.before(el('div','vacia','Nadie en la cola todavía'));else if(top.length&&v)v.remove();
 }
 new EventSource('events').onmessage=e=>render(JSON.parse(e.data));
</script>
</body></html>
